<div class="menu-container">
  <div class="menu-panel col-sm-4 col-lg-3">
    <div class="menu-header">
      <div class="menu-title">
        <img src="assets/brand/augustus-symbol.svg" alt="Augustus" />
        <span>Augustus - Controlador de finanças pessoais</span>
      </div>
      <div class="menu-close">
        <button
          class="br-button circle"
          type="button"
          aria-label="Fechar o menu"
          (click)="fecharMenu.emit()"
        >
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <nav class="menu-body" role="tree">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.url"
        class="menu-item"
        role="treeitem"
        [class.active]="itemAtivo === item.id"
        [attr.aria-current]="itemAtivo === item.id ? 'page' : null"
        (click)="fecharMenu.emit()"
      >
        <span class="icon"><i [class]="item.icon" aria-hidden="true"></i></span>
        <span class="content">{{ item.name }}</span>
      </a>
    </nav>

    <div class="menu-footer">
      <div class="menu-info">
        <div class="text-center text-down-01">
          Augustus · Controlador de finanças pessoais
        </div>
      </div>
    </div>
  </div>

  <div
    class="menu-scrim"
    tabindex="0"
    aria-hidden="true"
    (click)="fecharMenu.emit()"
    (keydown.enter)="fecharMenu.emit()"
  ></div>
</div>
