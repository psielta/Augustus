<section class="auth-shell">
  <div class="br-card auth-card">
    <div class="card-header">
      <h1>Verifique seu email</h1>
    </div>
    <div class="card-content">
      <p class="mb-3" *ngIf="email() as e">
        Enviamos um link de verificação para <strong>{{ e }}</strong>.
      </p>
      <p class="mb-3" *ngIf="!email()">
        Enviamos um link de verificação para o email cadastrado.
      </p>
      <p class="mb-4">
        Abra a mensagem e clique no link para liberar o login. O link expira em 24 horas.
      </p>

      <br-message
        *ngIf="reenvioFeito()"
        state="info"
        message="Se sua conta existir, enviamos um novo email. Aguarde alguns minutos antes de tentar novamente."
        class="mb-3"
      ></br-message>

      <div class="d-flex flex-wrap align-items-center gap-2">
        <br-button
          type="button"
          emphasis="secondary"
          [disabled]="!email() || reenvioPendente()"
          (click)="reenviar()"
        >
          {{ reenvioPendente() ? 'Reenviando...' : 'Reenviar email' }}
        </br-button>
        <a class="br-button" routerLink="/auth/login">Já verifiquei, entrar</a>
      </div>
    </div>
  </div>
</section>
