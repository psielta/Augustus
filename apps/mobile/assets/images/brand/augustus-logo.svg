<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Augustus - Controlador de finanças pessoais</title>
  <desc id="desc">Logo do Augustus com letra A azul, seta verde de crescimento e moeda dourada.</desc>
  <rect width="1200" height="1200" fill="#ffffff"/>
  <defs>
    <linearGradient id="blueGradient" x1="320" x2="820" y1="170" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f62d2"/>
      <stop offset="1" stop-color="#0047b8"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="320" x2="900" y1="765" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#009746"/>
      <stop offset="1" stop-color="#0aa64b"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="535" x2="675" y1="625" y2="765" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd21a"/>
      <stop offset="1" stop-color="#e8b600"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".12"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M362 590 550 210c28-56 104-56 132 0l160 323"
          fill="none"
          stroke="url(#blueGradient)"
          stroke-width="88"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M362 590c52-7 92-21 121-38l133-265 88 178"
          fill="none"
          stroke="#ffffff"
          stroke-width="70"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <rect x="520" y="475" width="47" height="87" rx="2" fill="url(#greenGradient)"/>
    <rect x="602" y="418" width="47" height="112" rx="2" fill="url(#greenGradient)"/>
    <path d="M336 622c188-9 405-58 527-221"
          fill="none"
          stroke="url(#greenGradient)"
          stroke-width="39"
          stroke-linecap="round"/>
    <path d="M846 376 934 342 922 436Z" fill="#0aa64b"/>
    <path d="M345 654c69 139 224 202 370 156 77-24 139-78 176-150l-78-85c-24 86-91 153-181 175-106 25-217-17-283-96Z"
          fill="url(#greenGradient)"/>
    <circle cx="604" cy="690" r="91" fill="#ffffff"/>
    <circle cx="604" cy="690" r="70" fill="url(#goldGradient)"/>
    <text x="604" y="726"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="88"
          font-weight="700"
          fill="#ffffff">$</text>
  </g>

  <text x="600" y="945"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="184"
        font-weight="800"
        letter-spacing="-2"
        fill="#0753c7">Augustus</text>

  <path d="M130 1030h90" stroke="#009746" stroke-width="7" stroke-linecap="round"/>
  <path d="M980 1030h90" stroke="#009746" stroke-width="7" stroke-linecap="round"/>
  <text x="600" y="1048"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="46"
        font-weight="600"
        fill="#3b3b3b">Controlador de finanças pessoais</text>
</svg>
