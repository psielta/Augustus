info:
  app:
    version: '@project.version@'

spring:
  application:
    name: augustus-backend
  config:
    import: "optional:file:./.env[.properties]"
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3307/augustus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${AUGUSTUS_DB_USERNAME}
    password: ${AUGUSTUS_DB_PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: filesystem:./flyway/sql
  mail:
    host: ${AUGUSTUS_MAIL_HOST:smtp.gmail.com}
    port: ${AUGUSTUS_MAIL_PORT:587}
    username: ${AUGUSTUS_MAIL_USERNAME:}
    password: ${AUGUSTUS_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  task:
    execution:
      pool:
        max-size: 16
        queue-capacity: 100
        keep-alive: "10s"
  devtools:
    add-properties: false
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
      fail-on-unknown-properties: false
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: NON_NULL

logging:
  level:
    root: INFO
    org:
      springframework:
        security: INFO
        web:
          filter: INFO
        data:
          jpa: INFO
          jdbc: INFO
      hibernate:
        orm:
          jdbc:
            bind: INFO
        SQL: INFO
        type: INFO
    com:
      zaxxer:
        hikari:
          HikariConfig: INFO
    br:
      com:
        augustus:
          backend: INFO

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 250
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

springdoc:
  version: '@springdoc.version@'
  api-docs:
    path: /api-docs
    version: openapi-3-1
  swagger-ui:
    layout: BaseLayout
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
    supported-submit-methods: ["get", "post"]
  show-actuator: false
  cache:
    disabled: true

management:
  server:
    port: 9101
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: "/"
      path-mapping:
        prometheus: "metrics"

auth:
  jwt:
    secret: ${AUGUSTUS_JWT_SECRET}
    access-ttl: PT15M
    refresh-ttl: P30D
    verificacao-ttl: P1D
    issuer: augustus-backend
  lockout:
    max-falhas: 5
    duracao-minutos: 15
  verificacao:
    base-url: ${AUGUSTUS_VERIFICACAO_URL:http://localhost:8080/api/auth/verify-email}
  mail:
    from: ${AUGUSTUS_MAIL_FROM:}
  resend:
    cooldown: PT1M
