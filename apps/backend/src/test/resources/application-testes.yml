spring:
  application:
    name: augustus-backend
  config:
    activate:
      on-profile: testes
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: filesystem:./flyway/sql
  mail:
    host: localhost
    port: 25
    username: test
    password: test
  devtools:
    add-properties: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

springdoc:
  version: '@springdoc.version@'
  api-docs:
    path: /api-docs
    version: openapi-3-1
  swagger-ui:
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
  show-actuator: false
  cache:
    disabled: true

management:
  server:
    port: 9101
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: "/"
      path-mapping:
        prometheus: "metrics"

auth:
  jwt:
    secret: test-only-segredo-fixo-32-bytes-xxxxxxxxxxxxxx
    access-ttl: PT5M
    refresh-ttl: PT1H
    verificacao-ttl: PT15M
    issuer: augustus-backend
  lockout:
    max-falhas: 5
    duracao-minutos: 15
  verificacao:
    base-url: http://localhost:8080/api/auth/verify-email
  mail:
    from: noreply@test.local
  resend:
    cooldown: PT5M
