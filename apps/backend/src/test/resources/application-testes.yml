application:
  module: api-regime-geral
  timezone: GMT-03:00
  locale: pt-BR
  dateTimeFormat: yyyy-MM-dd'T'HH:mm:ss.SSSZ
  dateTimeFormatBanco: yyyy-MM-dd
  ibs:
    enabled: true
  memoriacalculo:
    enabled: true

spring:
  application:
    name: api-regime-geral
  config:
    activate:
      on-profile: testes
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:file:./target/test-db/calculadora-test.db?date_class=TEXT&date_string_format=yyyy-MM-dd&foreign_keys=ON
    username: sa
    password: 
    driverClassName: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    defer-datasource-initialization: false
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
  sql:
    init:
      mode: embedded
  flyway:
    enabled: true
    locations: filesystem:./flyway/sql
    baseline-on-migrate: true
    mixed: true
  mail:
    host: localhost
    port: 25
    username: test
    password: test
  codec:
    max-in-memory-size: 500KB
  devtools:
    add-properties: false
  jackson:
    time-zone: ${application.timezone}
    locale: ${application.locale}
    serialization:
      write-dates-as-timestamps: false
                  
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
    
springdoc:
  version: '@springdoc.version@'
  api-docs:
    path: /api-docs
    version: openapi-3-1
  swagger-ui:
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
  show-actuator: false
  cache:
    disabled: true

cache:
  specs:
    - name: AliquotaAdRemProdutoRepository.buscarAliquotaAdRem
      expireAfterAccess: "P1D"
      initialCapacity: 100
    - name: AliquotaAdValoremProdutoRepository.buscarAliquotaAdValorem
      expireAfterAccess: "P1D"
      initialCapacity: 100
    - name: AliquotaPadraoRepository.buscarAliquotaUniao
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: AliquotaPadraoRepository.buscarAliquotaUf
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: AliquotaPadraoRepository.buscarAliquotaMunicipio
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: AliquotaReferenciaRepository.buscar
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: ClassificacaoTributariaRepository.buscarClassificacaoTributariaCbsIbs
      expireAfterAccess: "P1D"
      initialCapacity: 100
    - name: ClassificacaoTributariaRepository.buscarClassificacaoTributariaImpostoSeletivo
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: FundamentacaoClassificacaoRepository.buscar
      expireAfterAccess: "P1D"
      initialCapacity: 200
    - name: NbsAplicavelRepository.temNbsAplicavel
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NbsAplicavelRepository.temExcecaoNbsAplicavel
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NbsAplicavelRepository.temNbsAplicavelSemExcecao
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NbsAplicavelRepository.tem
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NbsRepository.existeNbs
      expireAfterAccess: "P1D"
      initialCapacity: 500
    - name: NcmAplicavelRepository.temNcmAplicavel
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NcmAplicavelRepository.temExcecaoNcmAplicavel
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NcmAplicavelRepository.temNcmAplicavelSemExcecao
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NcmAplicavelRepository.tem
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: NcmRepository.existeNcm
      expireAfterAccess: "P1D"
      initialCapacity: 500
    - name: PercentualReducaoRepository.buscar
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: SituacaoTributariaRepository.existeCst
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: TratamentoClassificacaoRepository.buscarTratamentoClassificacao
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: UfRepository.consultarPorSigla
      expireAfterAccess: "P1D"
      initialCapacity: 50
    - name: UfRepository.existeUf
      expireAfterAccess: "P1D"
      initialCapacity: 30
    - name: TemplateTokenizerService.tokenize
      expireAfterAccess: "P1D"
      initialCapacity: 100
    - name: TokenCacheService.get
      expireAfterAccess: "P1D"
      initialCapacity: 100
          
management:
  server:
    port: 9101
  endpoints:
    web:
      exposure:
        include: health, prometheus, caches
      base-path: "/"
      path-mapping:
        prometheus: "metrics"

auth:
  jwt:
    secret: test-only-segredo-fixo-32-bytes-xxxxxxxxxxxxxx
    access-ttl: PT5M
    refresh-ttl: PT1H
    verificacao-ttl: PT15M
    issuer: augustus-backend
  lockout:
    max-falhas: 5
    duracao-minutos: 15
  verificacao:
    base-url: http://localhost:8080/api/auth/verify-email
  mail:
    from: noreply@test.local
  resend:
    cooldown: PT0S
