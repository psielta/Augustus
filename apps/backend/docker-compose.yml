services:
  mysql:
    image: mysql:8.4
    container_name: augustus-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: augustus
      MYSQL_USER: ${AUGUSTUS_DB_USERNAME:-augustus}
      MYSQL_PASSWORD: ${AUGUSTUS_DB_PASSWORD:-augustus}
      MYSQL_ROOT_PASSWORD: ${AUGUSTUS_DB_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - augustus-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  augustus-mysql-data:
